async function sb(path, opts={}) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...opts,
    headers:{
      "Content-Type":"application/json", apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`,
      Prefer:"return=representation", ...(opts.headers||{})
    }
  });
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}

function gravedadDe(desv){

function impactoDe(i){

}

function parseTiempoEstimadoHoras(txt){

  const m = String(txt).match(/(\d+)/);
  return m ? parseInt(m[1],10) : SLA_HORAS_RESOLUCION_DEFECTO;
}

function calcularMetricasSLA(){
  const conRespuesta = incidents.filter(i=>i.fecha_hora_ejecucion && i.fecha_confirmacion);
  const tiemposRespuesta = conRespuesta.map(i=>horasEntre(i.fecha_hora_ejecucion, i.fecha_confirmacion));
  const tiempoMedioRespuesta = tiemposRespuesta.length ? tiemposRespuesta.reduce((a,b)=>a+b,0)/tiemposRespuesta.length : null;

  const conResolucion = incidents.filter(i=>i.fecha_confirmacion && i.fecha_resolucion);
  const tiemposResolucion = conResolucion.map(i=>horasEntre(i.fecha_confirmacion, i.fecha_resolucion));
  const tiempoMedioResolucion = tiemposResolucion.length ? tiemposResolucion.reduce((a,b)=>a+b,0)/tiemposResolucion.length : null;

  const resueltasConPlazo = incidents.filter(i=>i.fecha_confirmacion && i.fecha_resolucion);
  let dentroPlazo = 0;
  resueltasConPlazo.forEach(i=>{
    const horasComprometidas = parseTiempoEstimadoHoras(i.tiempo_estimado_reparacion);
    const horasReales = horasEntre(i.fecha_confirmacion, i.fecha_resolucion);
    if (horasReales <= horasComprometidas) dentroPlazo++;
  });
  const pctDentroPlazo = resueltasConPlazo.length ? (dentroPlazo/resueltasConPlazo.length*100) : null;

  const escaladas = incidents.filter(i=>i.escalado_responsable);
  const pctEscaladas = incidents.length ? (escaladas.length/incidents.length*100) : 0;

  const fueraSLA = incidents.filter(i=>{
    if (i.estado_actual==="Resuelta") return false;
    if (!i.fecha_confirmacion && horasDesde(i.fecha_hora_ejecucion) > SLA_HORAS_CONFIRMACION) return true;
    if (i.fecha_confirmacion){
      const limite = parseTiempoEstimadoHoras(i.tiempo_estimado_reparacion);
      if (horasDesde(i.fecha_confirmacion) > limite) return true;
    }
    return false;
  });

  const conEscalado = incidents.filter(i=>i.escalado_responsable && i.fecha_escalado && i.fecha_hora_ejecucion);
  const tiemposEscalado = conEscalado.map(i=>horasEntre(i.fecha_hora_ejecucion, i.fecha_escalado));
  const tiempoMedioEscalado = tiemposEscalado.length ? tiemposEscalado.reduce((a,b)=>a+b,0)/tiemposEscalado.length : null;

  return { tiempoMedioRespuesta, tiempoMedioResolucion, pctDentroPlazo, pctEscaladas, fueraSLA, tiempoMedioEscalado, totalEscaladas:escaladas.length };
}

    <canvas id="slaChart" height="100"></canvas>
  </div>`;
}

function drawSLACharts(){

  const respuesta = incidents.filter(i=>i.fecha_confirmacion).map(i=>i.fecha_hora_ejecucion?horasEntre(i.fecha_hora_ejecucion,i.fecha_confirmacion):0);
  const resolucion = incidents.filter(i=>i.fecha_confirmacion).map(i=>i.fecha_resolucion?horasEntre(i.fecha_confirmacion,i.fecha_resolucion):0);
  new Chart(ctx, {type:"bar", data:{labels, datasets:[

}

      ${alertas10h.map(i=>`<div class="text-sm text-orange-700 dark:text-orange-300 cursor-pointer hover:underline" onclick="openIncident(${i.id_anomalia})">• #${i.id_anomalia} — Sin resolver tras 10h desde confirmación</div>`).join("")}
    </div>`;
  }

  const cargaTecnicos = tecnicosDB.map(t=>{
    const abiertas = incidents.filter(i=>i.tecnico_asignado===t.nombre && i.estado_actual!=="Resuelta").length;
    return {nombre:t.nombre, abiertas};
  });

  return `
  <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3 mb-5">
    ${cards.map(c=>`<div class="${c.bg} rounded-xl p-3 border dark:border-gray-800"><div class="text-xl mb-1">${c.ic}</div><div class="text-xl font-bold ${c.c}">${c.v}</div><div class="text-xs text-gray-500 dark:text-gray-400">${c.l}</div></div>`).join("")}
  </div>
  ${escaladoHtml}
  ${currentUser.rol==="responsable" ? `
  <div class="bg-white dark:bg-gray-900 rounded-2xl border dark:border-gray-800 p-4 mb-5">
    <h3 class="font-bold text-gray-800 dark:text-gray-100 mb-3 text-sm">Carga de trabajo por técnico</h3>
    <div class="space-y-2">
      ${cargaTecnicos.map(t=>`<div class="flex items-center gap-3">
        <span class="text-sm text-gray-600 dark:text-gray-300 w-32 truncate">${t.nombre}</span>
        <div class="flex-1 bg-gray-100 dark:bg-gray-800 rounded-full h-3 overflow-hidden"><div class="bg-blue-500 h-3 rounded-full" style="width:${Math.min(t.abiertas*20,100)}%"></div></div>
        <span class="text-xs font-bold text-gray-700 dark:text-gray-300 w-8">${t.abiertas}</span>
      </div>`).join("")}
    </div>
  </div>` : ""}
  <div class="bg-white dark:bg-gray-900 rounded-2xl border dark:border-gray-800 p-4">
    <h3 class="font-bold text-gray-800 dark:text-gray-100 mb-3 text-sm">Últimas incidencias</h3>
    ${tablaIncidencias(incidents.slice(0,6))}
  </div>`;
}

function tablaIncidencias(list){
  if (!list.length) return `<p class="text-sm text-gray-400 text-center py-8">No hay incidencias</p>`;
  return `<div class="overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="bg-gray-50 dark:bg-gray-800 border-b dark:border-gray-700">
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">ID</th>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase hidden sm:table-cell">Inversor</th>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Ubicación</th>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Gravedad</th>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Desv.%</th>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Estado</th>
      <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase hidden md:table-cell">Técnico</th>
      <th></th>
    </tr></thead><tbody>
    ${list.map((i,idx)=>{
      const g = i.gravedad || gravedadDe(i.desviacion_porcentaje);
      const desv = i.desviacion_porcentaje!=null ? parseFloat(i.desviacion_porcentaje).toFixed(1)+"%" : "—";
      return `<tr class="border-b dark:border-gray-800 last:border-0 cursor-pointer hover:bg-blue-50 dark:hover:bg-blue-900/20 ${i.escalado_responsable&&i.estado_actual!=="Resuelta"?"pulse-red":idx%2?"bg-gray-50/50 dark:bg-gray-800/30":""}" onclick="openIncident(${i.id_anomalia})">
        <td class="px-3 py-2.5 font-mono font-bold text-gray-900 dark:text-white">#${i.id_anomalia}</td>
        <td class="px-3 py-2.5 text-xs text-gray-500 dark:text-gray-400 font-mono hidden sm:table-cell">${i.numero_placa||"—"}</td>
        <td class="px-3 py-2.5 text-gray-700 dark:text-gray-300 max-w-32 truncate">${i.ubicacion||"—"}</td>
        <td class="px-3 py-2.5">${gravBadge(g)}</td>
        <td class="px-3 py-2.5 font-semibold ${Math.abs(parseFloat(desv))>40?"text-red-600 dark:text-red-400":"text-yellow-600 dark:text-yellow-400"}">${desv}</td>
        <td class="px-3 py-2.5">${estadoBadge(i.estado_actual)}</td>
        <td class="px-3 py-2.5 text-xs text-gray-500 dark:text-gray-400 hidden md:table-cell">${i.tecnico_asignado||"Sin asignar"}</td>
        <td class="px-3 py-2.5 text-right text-blue-500 dark:text-blue-400 text-xs">Ver →</td>
      </tr>`;
    }).join("")}
    </tbody></table></div>`;
}

function viewIncidencias(){
  const isResp = currentUser.rol==="responsable";
  const visibles = isResp ? incidents : incidents.filter(i=>!i.tecnico_asignado || i.tecnico_asignado===currentUser.nombre);
  return `
  <div class="bg-white dark:bg-gray-900 rounded-2xl border dark:border-gray-800 p-4">
    <div class="flex flex-col sm:flex-row gap-2 mb-4">
      <input id="searchBox" oninput="filterIncTable()" placeholder="Buscar por ID, inversor o ubicación..." class="flex-1 border border-gray-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      <select id="filterEstado" onchange="filterIncTable()" class="border border-gray-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-3 py-2.5 text-sm">
        <option value="">Todos los estados</option>
        <option>Pendiente</option><option>Confirmada</option><option>En gestión</option><option>Escalada</option><option>Resuelta</option>

    </div>

}
function filterIncTable(){
  const s = document.getElementById("searchBox").value.toLowerCase();
  const e = document.getElementById("filterEstado").value.toLowerCase();
  document.querySelectorAll("#incTableWrap tbody tr").forEach(r=>{
    const t = r.textContent.toLowerCase();
    r.style.display = (t.includes(s) && t.includes(e)) ? "" : "none";
  });
}

function openIncident(id){
  currentIncident = incidents.find(i=>i.id_anomalia==id);
  if (!currentIncident) return;
  renderModal();
}
function closeModal(){ document.getElementById("modalOverlay")?.remove(); currentIncident=null; }
function syncLocal(){ const idx=incidents.findIndex(i=>i.id_anomalia===currentIncident.id_anomalia); if(idx>-1) incidents[idx]={...currentIncident}; }
function refreshAfterAction(){ syncLocal(); closeModal(); renderTab(); openIncident(currentIncident?.id_anomalia); }

function timelineHtml(i){
  if (!i.historial_arreglos) return `<p class="text-sm text-gray-400 italic">Sin eventos registrados</p>`;
  const lineas = i.historial_arreglos.split("\n").filter(Boolean).reverse();
  return `<div class="space-y-0">${lineas.map((l,idx)=>`
    <div class="flex gap-3">
      <div class="flex flex-col items-center">
        <div class="w-2.5 h-2.5 rounded-full ${idx===0?"bg-blue-600":"bg-gray-300 dark:bg-gray-600"} mt-1.5"></div>
        ${idx<lineas.length-1?'<div class="w-0.5 flex-1 bg-gray-200 dark:bg-gray-700"></div>':""}
      </div>
      <div class="pb-3 text-sm text-gray-700 dark:text-gray-300">${l}</div>
    </div>`).join("")}</div>`;
}

      <button onclick="resolverTecnico()" class="flex-1 min-w-32 px-4 py-2.5 bg-green-600 text-white rounded-xl font-semibold text-sm hover:bg-green-700">✔ Resuelta</button>
    </div>
    <button onclick="toggleAmpliacion()" class="w-full px-4 py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl text-sm font-semibold">⏳ Solicitar ampliación de tiempo</button>

        <option value="">Nuevo tiempo estimado</option>
        <option value="2 horas">2 horas</option><option value="6 horas">6 horas</option>
        <option value="24 horas">24 horas</option><option value="46 horas">46 horas</option>
      </select>
      <textarea id="motivoAmpliacion" rows="2" placeholder="Motivo de la ampliación..." class="w-full border border-yellow-300 dark:border-yellow-700 dark:bg-gray-800 dark:text-white rounded-lg px-3 py-2 text-sm resize-none"></textarea>
      <button onclick="solicitarAmpliacion()" class="w-full px-4 py-2 bg-yellow-500 text-white rounded-xl text-sm font-semibold hover:bg-yellow-600">Confirmar ampliación</button>
    </div>`;

  }

  document.body.insertAdjacentHTML("beforeend", `

    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto fade-in">

          <div class="flex items-center gap-2 flex-wrap">
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">Incidencia #${i.id_anomalia}</h2>

          </div>
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">${i.ubicacion||"—"} · Inversor ${i.numero_placa||"—"}</p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-2xl leading-none">×</button>
      </div>
      <div class="px-5 py-4 space-y-5">
        ${alert2h?'<div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-3 text-sm text-red-700 dark:text-red-300 font-medium">⏱️ +2h sin confirmación — pendiente de escalado automático</div>':""}

          <div class="bg-blue-50 dark:bg-blue-900/20 rounded-xl p-2"><div class="text-sm font-bold text-blue-600 dark:text-blue-400">${i.numero_ampliaciones||0}</div><div class="text-xs text-gray-500 dark:text-gray-400">Ampliaciones</div></div>

        ${acciones?`<div class="space-y-2">${acciones}</div>`:""}

              ["Irradiancia",i.irradiancia_solar?i.irradiancia_solar+" W/m²":null],["Temp. módulo",i.temperatura_modulo?i.temperatura_modulo+" °C":null],
              ["Nubosidad",i.nubosidad_porcentaje!=null?i.nubosidad_porcentaje+"%":null],["Lectura real",i.lectura_real_kwh!=null?i.lectura_real_kwh+" kWh":null],

        <div>

            <button onclick="addComentario()" class="self-end px-4 py-2 bg-gray-800 dark:bg-gray-700 text-white rounded-xl text-sm font-semibold hover:bg-gray-900 dark:hover:bg-gray-600">Guardar</button>
          </div>
        </div>
      </div>

function diagnosticoIA(i){
  const desv = Math.abs(parseFloat(i.desviacion_porcentaje)||0);
  const nub = parseFloat(i.nubosidad_porcentaje)||0;
  if (desv>40 && nub<30) return "Desviación muy alta con baja nubosidad — probable fallo físico del inversor o paneles dañados. Se recomienda inspección presencial prioritaria.";
  if (desv>40) return "Desviación grave. Aunque hay nubosidad significativa, no explica una caída tan alta — revisar conexiones e inversor.";
  if (desv>=20) return "Desviación leve, compatible con suciedad acumulada o sombra parcial. Se recomienda limpieza de paneles.";
  return "Producción dentro de parámetros esperados según condiciones meteorológicas.";
}

async function confirmarRecepcion(){
  const tiempo = document.getElementById("tiempoEstSelect")?.value;
  if (!tiempo) return toast("Debes indicar un tiempo estimado de reparación","error");
  const now = new Date().toISOString();
  const hist = appendHistorial(currentIncident, `Confirmó recepción de la incidencia. Tiempo estimado de reparación: ${tiempo}.`);
  const payload = { estado_actual:"Confirmada", fecha_confirmacion:now, tiempo_estimado_reparacion:tiempo, tecnico_asignado:currentUser.nombre, historial_arreglos:hist };
  await patchInc(currentIncident.id_anomalia, payload);
  Object.assign(currentIncident, payload);
  toast("✅ Recepción confirmada"); refreshAfterAction();
}
async function marcarEnGestion(){
  const hist = appendHistorial(currentIncident, `Cambió el estado a "En gestión".`);
  const payload = { estado_actual:"En gestión", historial_arreglos:hist };
  await patchInc(currentIncident.id_anomalia, payload); Object.assign(currentIncident,payload);
  toast("🔧 En gestión"); refreshAfterAction();
}
async function resolverTecnico(){
  const now = new Date().toISOString();
  const hist = appendHistorial(currentIncident, `Marcó la incidencia como Resuelta.`);
  const payload = { estado_actual:"Resuelta", fecha_resolucion:now, resuelto_por:currentUser.nombre, historial_arreglos:hist };
  await patchInc(currentIncident.id_anomalia, payload); Object.assign(currentIncident,payload);
  toast("✅ Incidencia resuelta"); refreshAfterAction();
}
async function resolverResponsable(){
  const now = new Date().toISOString();
  const hist = appendHistorial(currentIncident, `Resolvió la incidencia directamente como Responsable (sin técnico disponible).`);
  const payload = { estado_actual:"Resuelta", fecha_resolucion:now, resuelto_por:currentUser.nombre+" (Responsable)", historial_arreglos:hist };
  await patchInc(currentIncident.id_anomalia, payload); Object.assign(currentIncident,payload);
  toast("✅ Resuelta por Responsable"); refreshAfterAction();
}
function toggleAmpliacion(){ document.getElementById("ampliacionForm")?.classList.toggle("hidden"); }
async function solicitarAmpliacion(){
  const nuevo = document.getElementById("nuevoTiempo")?.value;
  const motivo = document.getElementById("motivoAmpliacion")?.value?.trim();
  if (!nuevo || !motivo) return toast("Indica nuevo tiempo y motivo","error");
  const hist = appendHistorial(currentIncident, `Solicitó ampliación de tiempo → nuevo plazo: ${nuevo}. Motivo: ${motivo}`);
  const payload = {
    tiempo_estimado_reparacion: nuevo,
    numero_ampliaciones: (currentIncident.numero_ampliaciones||0)+1,
    motivo_ampliacion: motivo,
    historial_arreglos: hist
  };
  await patchInc(currentIncident.id_anomalia, payload); Object.assign(currentIncident,payload);
  toast("✅ Ampliación registrada"); refreshAfterAction();
}
async function addComentario(){
  const val = document.getElementById("comentarioInput")?.value?.trim();
  if (!val) return;
  const hist = appendHistorial(currentIncident, `Comentario: ${val}`);
  await patchInc(currentIncident.id_anomalia, {historial_arreglos:hist});
  Object.assign(currentIncident,{historial_arreglos:hist});
  toast("✅ Comentario guardado"); refreshAfterAction();
}

function viewRanking(){
  const porTecnico = {};
  incidents.forEach(i=>{

    porTecnico[i.tecnico_asignado] = porTecnico[i.tecnico_asignado] || {resueltas:0, tiempos:[]};
    if (i.estado_actual==="Resuelta") porTecnico[i.tecnico_asignado].resueltas++;
    if (i.fecha_confirmacion && i.fecha_resolucion){
      porTecnico[i.tecnico_asignado].tiempos.push(horasEntre(i.fecha_confirmacion,i.fecha_resolucion));

  const ranking = Object.entries(porTecnico).map(([nombre,d])=>({
    nombre, resueltas:d.resueltas,

function csvEscape(v){
  if (v==null) return "";
  const s = String(v).replace(/"/g,'""');
  return /[",\n;]/.test(s) ? `"${s}"` : s;
}

function descargarCSV(modo){
  let data = [...incidents];
  let nombreArchivo = "historial_incidencias";

  if (modo==="resueltas"){ data = data.filter(i=>i.estado_actual==="Resuelta"); nombreArchivo="incidencias_resueltas"; }
  if (modo==="escaladas"){ data = data.filter(i=>i.escalado_responsable); nombreArchivo="incidencias_escaladas"; }
  if (modo==="graves"){ data = data.filter(i=>Math.abs(parseFloat(i.desviacion_porcentaje)||0)>40); nombreArchivo="incidencias_graves"; }
  if (modo==="individual"){
    const id = document.getElementById("incidenciaIndividual")?.value;
    if (!id) return toast("Selecciona una incidencia","error");
    data = data.filter(i=>i.id_anomalia==id); nombreArchivo=`incidencia_${id}`;
  }
  if (modo==="filtro"){
    const desde = document.getElementById("filtroDesde")?.value;
    const hasta = document.getElementById("filtroHasta")?.value;
    const tecnico = document.getElementById("filtroTecnico")?.value;
    const estado = document.getElementById("filtroEstadoCSV")?.value;
    if (desde) data = data.filter(i=>i.fecha_hora_ejecucion && new Date(i.fecha_hora_ejecucion) >= new Date(desde));
    if (hasta) data = data.filter(i=>i.fecha_hora_ejecucion && new Date(i.fecha_hora_ejecucion) <= new Date(hasta+"T23:59:59"));
    if (tecnico) data = data.filter(i=>i.tecnico_asignado===tecnico);
    if (estado) data = data.filter(i=>i.estado_actual===estado);
    nombreArchivo = "historial_filtrado";
  }

  if (!data.length) return toast("No hay datos para exportar con estos filtros","error");

  const cols = ["id_anomalia","cups","numero_placa","ubicacion","nombre_tecnico","tecnico_asignado","fecha_hora_ejecucion",
    "irradiancia_solar","temperatura_modulo","nubosidad_porcentaje","lectura_real_kwh","lectura_estimada_kwh","desviacion_porcentaje",
    "gravedad","tipo_incidencia_actual","estado_actual","fecha_confirmacion","tiempo_estimado_reparacion","numero_ampliaciones",
    "motivo_ampliacion","fecha_resolucion","resuelto_por","escalado_responsable","fecha_escalado","motivo_escalado","historial_arreglos"];

  const header = cols.join(";");
  const rows = data.map(i => cols.map(c => csvEscape(i[c])).join(";"));
  const csv = "\uFEFF" + [header, ...rows].join("\n");

  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${nombreArchivo}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`✅ Descargado: ${data.length} registro(s)`);
}

function toggleNuevoForm(tipo){ document.getElementById(tipo==="tecnico"?"formTecnico":"formResponsable")?.classList.toggle("hidden"); }
async function crearTecnico(){
  const nombre=document.getElementById("newTecNombre").value.trim();
  const email=document.getElementById("newTecEmail").value.trim().toLowerCase();
  const pass=document.getElementById("newTecPass").value;
  const tel=document.getElementById("newTecTel").value.trim();
  if (!nombre||!email||!pass) return toast("Completa nombre, email y contraseña","error");
  await sb("tecnicos",{method:"POST", body:JSON.stringify({nombre,email,password:pass,telefono:tel||null})});
  toast("✅ Técnico creado"); await loadAll(); switchTab("usuarios");
}
async function crearResponsable(){
  const nombre=document.getElementById("newRespNombre").value.trim();
  const email=document.getElementById("newRespEmail").value.trim().toLowerCase();
  const pass=document.getElementById("newRespPass").value;
  const tel=document.getElementById("newRespTel").value.trim();
  if (!nombre||!email||!pass) return toast("Completa nombre, email y contraseña","error");
  await sb("responsables",{method:"POST", body:JSON.stringify({nombre,email,password:pass,telefono:tel||null})});
  toast("✅ Responsable creado"); await loadAll(); switchTab("usuarios");
}
async function toggleActivoTecnico(id,activo){
  await sb(`tecnicos?id=eq.${id}`,{method:"PATCH", body:JSON.stringify({activo:!activo})});
  toast(activo?"Técnico desactivado":"Técnico activado"); await loadAll(); switchTab("usuarios");
}
async function toggleActivoResponsable(id,activo){
  await sb(`responsables?id=eq.${id}`,{method:"PATCH", body:JSON.stringify({activo:!activo})});
  toast(activo?"Responsable desactivado":"Responsable activado"); await loadAll(); switchTab("usuarios");
}

renderLogin();
